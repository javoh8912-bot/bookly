    <h1 class="sahifa-sarlavhasi">Sevimli kitoblar</h1>

    <div class="container">
        <div class="row g-3" id="kitoblarRoyxati"></div>
        <p id="kitobTopilmadiXabari" class="mt-3 d-none">Kitob topilmadi.</p>
    </div>

    <script src="db.js"></script>
    <script>
        let yoqimlilar = JSON.parse(localStorage.getItem("Favorites") || "[]")
        Kitoblar = Kitoblar.filter(kitob => yoqimlilar.includes(kitob.id))
        if (Kitoblar.length === 0) {
            document.querySelector("#kitoblarRoyxati").innerHTML =
                '<p class="bosh-xabar">Hozircha yoqimlilarga kitob qo‘shilmagan.</p>'
        }
    </script>
    <script src="script.js"></script>
    <script>
        document.querySelector("#qidiruvShakli").addEventListener("submit", function (event) {
            event.preventDefault()
        })

        document.querySelector("#kitobQidirish").addEventListener("input", function () {
            let qidiruv = this.value.toLowerCase().trim()
            let kartalar = document.querySelectorAll("#kitoblarRoyxati > div")
            let topildi = false

            kartalar.forEach(karta => {
                karta.classList.toggle("d-none", !karta.textContent.toLowerCase().includes(qidiruv))
                if (!karta.classList.contains("d-none")) topildi = true
            })

            document.querySelector("#kitobTopilmadiXabari").classList.toggle("d-none", topildi)
        })
    </script>
    
    <a class="position-fixed bottom-0 end-0 m-3 hisob-tugmasi rejim-almashtirish" href="../kun/yoqimlilar.html" aria-label="Kunduzgi rejimga o'tish" title="Kunduzgi rejimga o'tish"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg></a>
