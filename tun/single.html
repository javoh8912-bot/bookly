    <script src="script.js"></script>
    <script>
        const id = Number(new URLSearchParams(window.location.search).get("id"));
        const book = Kitoblar.find(item => item.id === id);

        if (book) {
            document.querySelector(".rasmcha").src = book.rasm;
            document.querySelector(".rasmcha").alt = book.nomi;
            document.querySelector(".janr").textContent = book.janr;
            document.querySelector(".nomi").textContent = book.nomi;
            document.querySelector(".muallif").textContent = `Muallif: ${book.muallif}`;
            document.querySelector(".tavsif").textContent = book.tavsif;
            document.querySelector(".narx").textContent = `${book.narx} so'm`;
            const onlineKitob = document.querySelector("#onlineKitob");
            if (book.link) {
                onlineKitob.href = book.link;
                onlineKitob.classList.remove("d-none");
            }
            document.querySelector("#sevimliKitob").addEventListener("click", event => {
                event.preventDefault();
                const favorites = JSON.parse(localStorage.getItem("Favorites") || "[]");
                if (!favorites.includes(book.id)) {
                    favorites.push(book.id);
                    localStorage.setItem("Favorites", JSON.stringify(favorites));
                    alert("Yoqimlilarga qo'shildi");
                } else {
                    alert("Bu kitob yoqimlilarga qo'shilgan");
                }
            });
        } else {
            document.querySelector("#kitobTafsilotlari").classList.add("d-none");
            document.querySelector("#kitobTopilmadi").classList.remove("d-none");
        }

    </script>
