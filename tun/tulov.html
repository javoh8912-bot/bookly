<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To'lov - Bookly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar shadow-sm">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" width="200" alt="Bookly">
            </a>
            <a class="hisob-tugmasi" href="savat.html">Savatga qaytish</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card tolov-kartasi border-0 shadow mx-auto p-4">
            <h1 class="mb-3">To'lov</h1>
            <form id="tolovShakli">
                <label for="ism" class="form-label">Ism</label>
                <input type="text" id="ism" class="form-control mb-3" required>

                <label for="familiya" class="form-label">Familya</label>
                <input type="text" id="familiya" class="form-control mb-3" required>

                <label for="kartaRaqami" class="form-label">Karta raqami</label>
                <input type="text" id="kartaRaqami" class="form-control mb-3" inputmode="numeric"
                    autocomplete="cc-number" placeholder="0000 0000 0000 0000" minlength="16" maxlength="19"
                    pattern="[0-9 ]{16,19}" required>

                <button type="submit" class="hisob-tugmasi w-100">To'lash</button>
            </form>
            <p class="text-muted small mt-3 mb-0">Bu demo to'lov. Karta ma'lumotlari saqlanmaydi.</p>
        </div>
    </main>

    <script src="db.js"></script>
    <script>
        let savat = JSON.parse(localStorage.getItem("Savat") || "[]")
        let jami = 0

        savat.forEach(id => {
            let kitob = Kitoblar.find(kitob => kitob.id === id)
            if (kitob) {
                jami += kitob.narx
            }
        })


        document.querySelector("#tolovShakli").addEventListener("submit", function (event) {
            event.preventDefault()

            if (savat.length === 0) {
                alert("Savat bo'sh.")
                return
            }

            let karta = document.querySelector("#kartaRaqami").value.replaceAll(" ", "")
            if (karta.length !== 16) {
                alert("Karta raqamini to'g'ri kiriting.")
                return
            }

            localStorage.setItem("Savat", "[]")
            alert("To'lov amalga oshdi! Buyurtmangiz 3 kun ichida yetkazib beriladi. Yoki umuman kelmaydi rozi bo'lasiz!!!")
            window.location.href = "savat.html"
        })
    </script>
    <a class="position-fixed bottom-0 end-0 m-3 hisob-tugmasi rejim-almashtirish" href="../kun/tulov.html" aria-label="Kunduzgi rejimga o'tish" title="Kunduzgi rejimga o'tish"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg></a>
</body>

</html>
