    <h1 class="sahifa-sarlavhasi">Savat</h1>

    <div class="container">
        <div class="row g-3" id="kitoblarRoyxati"></div>
        <p id="kitobTopilmadiXabari" class="mt-3 d-none">Kitob topilmadi.</p>
        <div id="savatXulosasi" class="text-end my-4">
            <h3>Jami: <span id="savatJami">0 so'm</span></h3>
            <a href="tulov.html" id="tolovTugmasi" class="btn btn-light mt-2">To'lov qilish</a>
        </div>
    </div>



    <script src="db.js"></script>
    <script>
        function savatniChiqar() {
            let savat = JSON.parse(localStorage.getItem("Savat") || "[]").map(Number)
            let kitoblar = Kitoblar.filter(kitob => savat.includes(Number(kitob.id)))
            let bookList = document.querySelector("#kitoblarRoyxati")
            let jami = 0

            bookList.innerHTML = ""

            if (savat.length === 0 || kitoblar.length === 0) {
                bookList.innerHTML = '<p class="bosh-xabar">Hozircha savatga kitob qo‘shilmagan.</p>'
                document.querySelector("#savatXulosasi").classList.add("d-none")
                return
            }

            document.querySelector("#savatXulosasi").classList.remove("d-none")

            kitoblar.forEach(kitob => {
                let miqdor = savat.filter(id => id === Number(kitob.id)).length
                jami += kitob.narx * miqdor

                let karta = document.createElement("div")
                karta.className = "col-12 col-sm-6 col-lg-4"
                karta.innerHTML = `
                    <div class="card kitob-kartasi mb-3">
                        <div class="row g-0">
                            <div class="col-md-4">
                                <img src="${kitob.rasm}" class="img-fluid rounded-start savat-muqovasi"
                                    alt="${kitob.nomi}">
                            </div>
                            <div class="col-md-8">
                                <div class="card-body kitob-malumoti">
                                    <p class="card-text kitob-janri">${kitob.janr}</p>
                                    <h5 class="card-title">${kitob.nomi}</h5>
                                    <p class="card-text">${kitob.muallif}</p>
                                    <p class="card-text">${kitob.narx.toLocaleString()} so'm</p>
                                    <div class="d-flex align-items-center gap-2">
                                        <button type="button" class="btn btn-success btn-sm px-3" onclick="miqdorniOzgartir(${kitob.id}, -1)">-</button>
                                        <span class="fw-bold">${miqdor}</span>
                                        <button type="button" class="btn btn-success btn-sm px-3" onclick="miqdorniOzgartir(${kitob.id}, 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `
                bookList.append(karta)
            })

            document.querySelector("#savatJami").textContent = `${jami.toLocaleString()} so'm`
        }

        function miqdorniOzgartir(id, son) {
            let savat = JSON.parse(localStorage.getItem("Savat") || "[]").map(Number)

            if (son > 0) {
                savat.push(id)
            } else {
                let index = savat.indexOf(id)
                if (index !== -1) {
                    savat.splice(index, 1)
                }
            }

            localStorage.setItem("Savat", JSON.stringify(savat))
            savatniChiqar()
        }

        document.querySelector("#qidiruvShakli").addEventListener("submit", function (event) {
            event.preventDefault()
        })

        document.querySelector("#kitobQidirish").addEventListener("input", function () {
            let qidiruv = this.value.toLowerCase().trim()
            let kartalar = document.querySelectorAll("#kitoblarRoyxati > div")
            let topildi = false

            kartalar.forEach(karta => {
                karta.classList.toggle("d-none", !karta.textContent.toLowerCase().includes(qidiruv))
                if (!karta.classList.contains("d-none")) topildi = true
            })

            document.querySelector("#kitobTopilmadiXabari").classList.toggle("d-none", topildi)
        })

        savatniChiqar()
    </script>
    

    <a class="position-fixed bottom-0 end-0 m-3 hisob-tugmasi rejim-almashtirish" href="../tun/savat.html" aria-label="Tungi rejimga o'tish" title="Tungi rejimga o'tish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path></svg></a>
