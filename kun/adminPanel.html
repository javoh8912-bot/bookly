<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin panel | Bookly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>

    <nav class="navbar navbar-expand-md w-100 shadow-sm">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand me-lg-4" href="index.html">
                <img src="images/logo.png" width="200" alt="Bookly">
            </a>
            <div class="navbar-collapse" id="asosiyMenyu">
                <form class="qidiruv-shakli my-3" role="search">
                    <div class="input-group">
                        <input class="form-control border-0 rounded-start-pill ps-4" type="search"
                            placeholder="Kitob nomi, muallif yoki kategoriya..." aria-label="Qidirish">
                        <button class="btn btn-light border-0 rounded-end-pill" type="submit"
                            aria-label="Qidirish">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"></circle>
                                <path stroke-linecap="round" d="m16 16 4 4"></path>
                            </svg>
                        </button>
                    </div>
                </form>
                <ul class="navbar-nav align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link text-nowrap" href="index.html">Bosh sahifa</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="catalog.html">Katalog</a></li>

                    <li class="nav-item d-flex align-items-center gap-3">
                        <a href="yoqimlilar.html" aria-label="Sevimlilar">
                            <img src="images/yurak.png" width="45" height="45">
                        </a>
                        <a class="position-relative" href="savat.html" aria-label="Savat">
                            <img src="images/savatcha.png" width="25" height="25">
    
                        </a>
                    </li>
                    <li class="nav-item d-none" id="boshqaruvPaneli">

                    </li>
                </ul>
            </div>
        </div>
    </nav>



    <div class="container py-5">
        <form action="" class="malumot-shakli">
            <h1 class="h3 mb-4" id="formSarlavhasi">Yangi kitob qo'shish</h1>
            <label for="sarlavha" class="form-label">Kitob nomi</label>
            <input type="text" class="form-control mb-3" id="sarlavha" required>
            <label for="muallif" class="form-label">Muallif</label>
            <input type="text" class="form-control mb-3" id="muallif" required>
            <label for="janr" class="form-label">Janr</label>
            <select name="janr" id="janr" class="form-control mb-3 form-select" required>
                <option value="" disabled selected>Biror bir janr</option>
                <option value="Roman">Roman</option>
                <option value="Qissa">Qissa</option>
                <option value="Fantastika">Fantastika</option>
                <option value="Detektiv">Detektiv</option>
                <option value="Sarguzasht">Sarguzasht</option>
            </select>
            <label for="rasm" class="form-label">Muqova rasmi URL</label>
            <input type="url" class="form-control mb-3" id="rasm" required>
            <label for="link" class="form-label">Online o'qish havolasi</label>
            <input type="url" class="form-control mb-3" id="link">
            <label for="narx" class="form-label">Narxi (so'm)</label>
            <input type="number" class="form-control mb-3" id="narx" min="0" step="1" required>
            <label for="tavsif" class="form-label">Tavsif</label>
            <textarea class="form-control mb-3" id="tavsif" rows="3" required></textarea>
            <button type="submit" class="btn btn-warning" id="saqlashTugmasi">Kitobni saqlash</button>
        </form>
    </div>






    <script src="db.js"></script>
    <script src="admin.js"></script>
    <a class="position-fixed bottom-0 end-0 m-3 hisob-tugmasi rejim-almashtirish" href="../tun/adminPanel.html" aria-label="Tungi rejimga o'tish" title="Tungi rejimga o'tish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path></svg></a>
</body>
</html>
